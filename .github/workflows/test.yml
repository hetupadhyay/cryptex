name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cipher and analysis tests
        run: npm test

      # The site promises no external requests.
      - name: No external scripts, stylesheets or fonts
        run: node tools/check-external.js

      # Every page carries a copy of the masthead and footer.
      - name: Masthead and footer in sync on every page
        run: python3 tools/sync-shell.py --check

      - name: File stamps are up to date
        run: python3 tools/stamp.py --check
